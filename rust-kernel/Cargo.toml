[package]
name = "embers-rust-kernel"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "embers-rust-kernel"
path = "src/main.rs"
test = false
bench = false

[features]
default = []
fault-ud = []
fault-pf = []
fault-df = []

[dependencies]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
